plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.jay.realestate'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.jay.realestate'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        release {
            storeFile file('app.keystore')
            storePassword 'realestate'
            keyAlias 'app'
            keyPassword 'realestate'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
